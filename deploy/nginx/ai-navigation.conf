# 初装 HTTP。生产 HTTPS 见 ai-navigation.production.conf.example。
# 反代：/api/click、/api/hot-tools、/api/hot-categories → admin_api:8001；其余 → api_server:8096
# 与 pictent 并存，勿混 server 块。

server {
    listen 80;
    server_name ad996.com www.ad996.com;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/click {
        proxy_pass http://127.0.0.1:8001;
    }
    location /api/hot-tools {
        proxy_pass http://127.0.0.1:8001;
    }
    location /api/hot-categories {
        proxy_pass http://127.0.0.1:8001;
    }
    location / {
        proxy_pass http://127.0.0.1:8096;
    }
}
